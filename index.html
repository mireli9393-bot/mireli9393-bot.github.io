<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirəli Həşimli</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 80%;
        }
        h1 { color: #00d2ff; margin-bottom: 10px; }
        p { font-size: 18px; color: #ccc; }
    </style>
</head>
<body>

    <div class="box">
        <h1>Mən Mirəli Həşimliyəm</h1>
        <p>Xoş gəlmisiniz! Bu mənim şəxsi səhifəmdir.</p>
    </div>

</body>
</html>
